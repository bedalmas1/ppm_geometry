# A4 SuTraN hyperparameters (activity-only scope - see
# src/models/sutran/model.py's docstring). All values taken directly from
# the repo's own TRAIN_EVAL_SUTRAN_NDA.py, not guessed.
name: sutran
family: A
objective: full_suffix
d_model: 32
num_prefix_encoder_layers: 4
num_decoder_layers: 4
num_heads: 8
d_ff: 128
dropout: 0.2
batch_size: 128
epochs: 200
learning_rate: 0.0002
weight_decay: 0.0001
lr_decay_gamma: 0.96
patience: 24
max_grad_norm: 2.0
